<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rial Game | Adivina el número</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans (Tipografía moderna y limpia) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --accent: #b6f023;
            --accent-strong: #a3de1b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(ellipse at 50% 48%, rgba(182, 240, 35, 0.09), transparent 38%),
                linear-gradient(145deg, #141511 0%, #080908 52%, #11120f 100%);
            color: #F8FAFC;
            justify-content: flex-start;
        }

        button,
        input {
            font: inherit;
        }

        .phone-frame {
            position: relative;
            width: min(100%, 350px);
            margin: 0 auto;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px;
            background: linear-gradient(145deg, #777a72, #242621 18%, #11120f 52%, #65675f 100%);
            box-shadow: 0 30px 75px rgba(0, 0, 0, 0.64), 0 0 0 1px rgba(0, 0, 0, 0.8) inset;
        }

        .phone-frame::before,
        .phone-frame::after {
            position: absolute;
            z-index: 3;
            width: 3px;
            content: "";
            background: linear-gradient(#777a72, #292b26 45%, #777a72);
        }

        .phone-frame::before {
            top: 150px;
            left: -3px;
            height: 74px;
            border-radius: 3px 0 0 3px;
        }

        .phone-frame::after {
            top: 180px;
            right: -3px;
            height: 92px;
            border-radius: 0 3px 3px 0;
        }

        .phone-screen {
            position: relative;
            min-height: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 43px;
            background:
                radial-gradient(ellipse at 50% 12%, rgba(182, 240, 35, 0.07), transparent 34%),
                linear-gradient(160deg, #11120f 0%, #080908 66%, #11120f 100%);
        }

        .device-status {
            position: relative;
            height: 42px;
            padding: 14px 24px 0;
            color: #f5f5f3;
            font-size: 11px;
            font-weight: 700;
        }

        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 96px;
            height: 26px;
            transform: translateX(-50%);
            border: 1px solid rgba(255, 255, 255, 0.035);
            border-radius: 20px;
            background: #000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .device-status-icons {
            float: right;
            letter-spacing: 2px;
        }

        .calculator-display {
            min-height: 64px;
            display: block;
            overflow: hidden;
            padding: 6px 4px 10px;
            border: 0;
            background: transparent;
            color: #f7f7f3;
            font-size: clamp(2.5rem, 11vw, 3.5rem);
            font-weight: 300;
            letter-spacing: -0.06em;
            text-align: right;
            text-overflow: ellipsis;
            transition: color 180ms ease;
        }

        .calculator-display::placeholder {
            color: rgba(255, 255, 255, 0.3);
            opacity: 1;
        }

        .calculator-key {
            display: flex;
            aspect-ratio: auto;
            height: 48px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.035);
            border-radius: 50%;
            background: #30312e;
            color: #f7f7f5;
            font-size: 1.2rem;
            font-weight: 500;
            transition: transform 160ms ease, background-color 200ms ease, filter 200ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .calculator-key:hover {
            background: #42433f;
        }

        .calculator-key:active {
            transform: scale(0.91);
            filter: brightness(1.3);
        }

        .calculator-key.utility {
            background: #a5a69f;
            color: #11120f;
            font-size: 1rem;
            font-weight: 700;
        }

        .calculator-key.utility:hover {
            background: #c1c2bb;
        }

        .calculator-key.action {
            border-color: rgba(182, 240, 35, 0.5);
            background: var(--accent);
            color: #11120f;
            font-size: 1rem;
            font-weight: 800;
        }

        .calculator-key.action:hover {
            background: var(--accent-strong);
        }

        .calculator-key:disabled {
            cursor: not-allowed;
            opacity: 0.35;
        }

        .calculator-submit {
            aspect-ratio: auto;
            height: 48px;
            border-radius: 28px;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .brand-mark {
            box-shadow: 0 0 28px rgba(182, 240, 35, 0.18);
        }

        .game-card {
            background: transparent;
        }

        .guess-input {
            caret-color: var(--accent);
        }

        .guess-input:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .message-enter {
            animation: messageIn 0.32s cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }

        .text-2xl.title-hint {
            color: #b6f023;
            font-size: 1.2rem;
            transition: color 220ms ease, font-size 220ms ease;
        }

        .title-hint-enter {
            animation: messageIn 0.32s cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }

        .history-enter {
            animation: messageIn 0.42s cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: translateY(10px) scale(0.99); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 480px) {
            .phone-frame {
                width: min(100%, 350px);
                padding: 5px;
                border-radius: 44px;
            }

            .phone-screen {
                min-height: 0;
                border-radius: 39px;
            }

            .device-status {
                padding-right: 20px;
                padding-left: 20px;
            }

            .calculator-key {
                height: clamp(46px, 13vw, 48px);
            }
        }

        @media (min-height: 780px) {
            body {
                justify-content: center;
            }
        }

        @media (max-height: 740px) {
            body.min-h-screen {
                padding-block: 8px;
            }

            .device-status {
                height: 34px;
                padding-top: 10px;
            }

            .dynamic-island {
                top: 6px;
                width: 82px;
                height: 22px;
            }

            header {
                padding-top: 4px !important;
                padding-bottom: 8px !important;
            }

            main {
                padding-top: 8px !important;
                padding-bottom: 8px !important;
            }

            #game > div:first-child {
                margin-bottom: 10px;
            }

            #game h1 {
                font-size: 1.25rem;
            }

            #game h1 + p {
                font-size: 0.68rem;
            }

            .calculator-display {
                min-height: 50px;
                padding-top: 2px;
                padding-bottom: 6px;
            }

            .calculator-key {
                height: 44px;
            }

            #guessForm > div:first-child {
                margin-bottom: 8px;
            }

            #guessForm > div[role="group"] {
                gap: 6px;
            }

            .calculator-submit {
                height: 42px;
                margin-top: 8px;
            }

            #game > div:last-child {
                margin-bottom: 8px;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-[#0A0A0A] text-slate-100 flex flex-col items-center px-3 py-5 selection:bg-[#B6F023] selection:text-black">

    <div class="phone-frame">
        <div class="phone-screen">
            <div class="device-status" aria-hidden="true">
                <span>9:41</span>
                <span class="dynamic-island"></span>
                <span class="device-status-icons">● ▰</span>
            </div>

            <header class="w-full px-6 sm:px-8 pt-2 pb-3 flex items-center justify-between border-b border-white/[0.06]">
                <div class="flex items-center gap-3">
                    <div class="brand-mark w-9 h-9 rounded-xl bg-[#B6F023] flex items-center justify-center font-black text-black text-lg tracking-tighter">R</div>
                    <div class="flex flex-col">
                        <span class="text-lg font-bold tracking-tight text-white leading-none">Rial</span>
                        <span class="text-[9px] text-neutral-500 tracking-[0.16em] font-semibold uppercase mt-1">Game edition</span>
                    </div>
                </div>
                <div class="inline-flex items-center gap-2 rounded-full border border-white/[0.08] bg-white/[0.03] px-3 py-1.5 text-[10px] font-semibold text-neutral-300">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#B6F023] shadow-[0_0_10px_rgba(182,240,35,0.65)]"></span>
                    En línea
                </div>
            </header>

            <main class="w-full max-w-md mx-auto px-5 sm:px-6 py-2 flex-grow flex items-center justify-center">
        <div id="game" class="game-card w-full animate-pop relative overflow-hidden">
            
            <div class="text-center mb-3 relative z-10">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#B6F023]/[0.08] border border-[#B6F023]/20 mb-3">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#B6F023]"></span>
                    <span class="text-[10px] font-bold text-[#B6F023] tracking-[0.14em] uppercase">Adivina · 1 a 100</span>
                </div>
                <h1 id="gameTitle" aria-live="polite" class="text-2xl leading-tight font-bold tracking-tight text-white mb-1.5 transition-colors duration-200">Adivina el número</h1>
                <p id="gameSubtitle" class="text-neutral-500 text-xs leading-relaxed max-w-xs mx-auto transition-all duration-200">Introduce tu apuesta y descubre el número secreto.</p>
            </div>

            <form id="guessForm" class="relative z-10" onsubmit="handleGuess(event)">
                <div class="relative mb-2">
                    <label for="guessInput" class="sr-only">Tu número, entre 1 y 100</label>
                    <input 
                        type="number" 
                        id="guessInput" 
                        min="1" 
                        max="100" 
                        required 
                        autocomplete="off"
                        step="1"
                        aria-describedby="rangeHint"
                        inputmode="none"
                        placeholder="—" 
                        class="guess-input calculator-display w-full focus:outline-none"
                    >
                    <span id="rangeHint" class="sr-only">Introduce un número entero entre 1 y 100.</span>
                </div>

                <div id="messageContainer" class="mb-2 p-2.5 rounded-xl bg-neutral-950/70 border border-neutral-800 text-center relative z-10 hidden" role="status" aria-live="polite" aria-atomic="true">
                    <p id="messageText" class="text-xs leading-relaxed font-semibold"></p>
                </div>

                <div id="historySection" class="mb-2 py-1 border-t border-white/[0.07] relative z-10 hidden">
                    <div class="flex items-center justify-between gap-2">
                        <div class="shrink-0 flex items-center gap-1.5">
                            <span class="text-[9px] font-bold tracking-[0.1em] text-neutral-400 uppercase">Intentos</span>
                            <span id="attemptsBadge" class="text-[9px] bg-white/[0.06] text-neutral-300 px-1.5 py-0.5 rounded-full font-semibold">0</span>
                        </div>
                        <div id="historyList" class="min-w-0 flex flex-nowrap justify-end gap-1.5 overflow-x-auto py-1" aria-label="Historial de intentos"></div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-1.5" role="group" aria-label="Teclado numérico">
                    <button class="calculator-key" type="button" data-digit="7" aria-label="7">7</button>
                    <button class="calculator-key" type="button" data-digit="8" aria-label="8">8</button>
                    <button class="calculator-key" type="button" data-digit="9" aria-label="9">9</button>
                    <button class="calculator-key" type="button" data-digit="4" aria-label="4">4</button>
                    <button class="calculator-key" type="button" data-digit="5" aria-label="5">5</button>
                    <button class="calculator-key" type="button" data-digit="6" aria-label="6">6</button>
                    <button class="calculator-key" type="button" data-digit="1" aria-label="1">1</button>
                    <button class="calculator-key" type="button" data-digit="2" aria-label="2">2</button>
                    <button class="calculator-key" type="button" data-digit="3" aria-label="3">3</button>
                    <button id="clearBtn" class="calculator-key utility" type="button" aria-label="Borrar todo">AC</button>
                    <button class="calculator-key" type="button" data-digit="0" aria-label="0">0</button>
                    <button id="deleteBtn" class="calculator-key utility" type="button" aria-label="Borrar último dígito">⌫</button>
                </div>
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="calculator-key calculator-submit action w-full mt-2"
                >
                    <span>Comprobar</span>
                    <span aria-hidden="true" class="ml-2 text-lg">=</span>
                </button>
            </form>

            <div class="mt-2 flex items-center justify-between gap-3 text-[11px] text-neutral-400 relative z-10 pt-2 border-t border-white/[0.07]">
                <div class="flex items-center gap-2">
                    <div id="statusDot" class="w-2 h-2 rounded-full bg-[#B6F023]"></div>
                    <span>Estado <strong id="gameStatusText" class="text-white font-semibold">En curso</strong></span>
                </div>
                
                <button 
                    onclick="resetGame()" 
                    type="button"
                    class="rounded-lg px-2 py-1.5 text-neutral-400 hover:text-[#B6F023] hover:bg-white/[0.04] transition-all duration-200 cursor-pointer font-semibold"
                >
                    Nueva partida
                </button>
            </div>

        </div>
            </main>

            <div class="mx-auto mb-3 h-1 w-24 rounded-full bg-white/70" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        let guessHistory = [];
        let gameOver = false;

        const guessForm = document.getElementById('guessForm');
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const messageContainer = document.getElementById('messageContainer');
        const messageText = document.getElementById('messageText');
        const historySection = document.getElementById('historySection');
        const historyList = document.getElementById('historyList');
        const attemptsBadge = document.getElementById('attemptsBadge');
        const gameStatusText = document.getElementById('gameStatusText');
        const keypadButtons = document.querySelectorAll('[data-digit]');
        const clearBtn = document.getElementById('clearBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const gameTitle = document.getElementById('gameTitle');
        const gameSubtitle = document.getElementById('gameSubtitle');
        const defaultTitle = 'Adivina el número';
        const defaultSubtitle = 'Introduce tu apuesta y descubre el número secreto.';

        function dispatchInput() {
            guessInput.dispatchEvent(new Event('input', { bubbles: true }));
        }

        keypadButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (gameOver || guessInput.value.length >= 3) return;
                const nextValue = `${guessInput.value}${button.dataset.digit}`;
                guessInput.value = String(Number(nextValue));
                dispatchInput();
            });
        });

        clearBtn.addEventListener('click', () => {
            if (gameOver) return;
            guessInput.value = '';
            dispatchInput();
        });

        deleteBtn.addEventListener('click', () => {
            if (gameOver) return;
            guessInput.value = guessInput.value.slice(0, -1);
            dispatchInput();
        });

        function handleGuess(event) {
            event.preventDefault();
            if (gameOver) return;

            const userGuess = Number(guessInput.value);

            if (!Number.isInteger(userGuess) || userGuess < 1 || userGuess > 100) {
                showMessage("Por favor, introduce un número válido entre 1 y 100.", "warning");
                return;
            }

            messageContainer.classList.add('hidden');
            messageContainer.classList.remove('message-enter', 'animate-shake');
            attempts++;
            guessHistory.unshift({ value: userGuess, status: userGuess === secretNumber ? 'win' : (userGuess > secretNumber ? 'high' : 'low') });
            
            updateHistoryUI();

            if (userGuess === secretNumber) {
                gameOver = true;
                updateTitleHint('¡Número encontrado!', 'Adivinaste en ' + attempts + (attempts === 1 ? ' intento.' : ' intentos.'));
                showMessage(`🎉 ¡Correcto! Adivinaste el número secreto en ${attempts} ${attempts === 1 ? 'intento' : 'intentos'}.`, "success");
                triggerWinState();
            } else if (userGuess > secretNumber) {
                updateTitleHint('Demasiado alto', 'Prueba con un número menor.');
                triggerShake();
            } else {
                updateTitleHint('Demasiado bajo', 'Prueba con un número mayor.');
                triggerShake();
            }

            guessInput.value = '';
        }

        function updateTitleHint(title, subtitle) {
            gameTitle.textContent = title;
            gameSubtitle.textContent = subtitle;
            gameTitle.classList.add('title-hint');
            gameTitle.classList.remove('title-hint-enter');
            void gameTitle.offsetWidth;
            gameTitle.classList.add('title-hint-enter');
        }

        function resetTitle() {
            gameTitle.textContent = defaultTitle;
            gameSubtitle.textContent = defaultSubtitle;
            gameTitle.classList.remove('title-hint', 'title-hint-enter');
        }

        function showMessage(text, type) {
            messageContainer.classList.remove('hidden', 'bg-amber-500/10', 'border-amber-500/30', 'text-amber-300', 
                                              'bg-[#B6F023]/10', 'border-[#B6F023]/30', 'text-[#B6F023]', 
                                              'bg-sky-500/10', 'border-sky-500/30', 'text-sky-300');
            
            if (type === 'warning') {
                messageContainer.classList.add('bg-amber-500/10', 'border-amber-500/30', 'text-amber-300');
            } else if (type === 'success') {
                messageContainer.classList.add('bg-[#B6F023]/10', 'border-[#B6F023]/30', 'text-[#B6F023]');
            } else {
                messageContainer.classList.add('bg-sky-500/10', 'border-sky-500/30', 'text-sky-300');
            }

            messageText.textContent = text;
            messageContainer.classList.remove('message-enter');
            void messageContainer.offsetWidth;
            messageContainer.classList.add('message-enter');
        }

        function updateHistoryUI() {
            historySection.classList.remove('hidden');
            historySection.classList.add('history-enter');
            attemptsBadge.textContent = `${attempts} ${attempts === 1 ? 'intento' : 'intentos'}`;
            
            historyList.innerHTML = '';
            guessHistory.forEach(item => {
                const badge = document.createElement('div');
                let bgClass = 'bg-neutral-800 text-neutral-300 border-neutral-700';
                let icon = '';

                if (item.status === 'win') {
                    bgClass = 'bg-[#B6F023] text-black font-extrabold border-[#B6F023]';
                    icon = ' ✓';
                } else if (item.status === 'high') {
                    bgClass = 'bg-neutral-800 text-rose-400 border-rose-500/30';
                    icon = ' ↓';
                } else {
                    bgClass = 'bg-neutral-800 text-sky-400 border-sky-500/30';
                    icon = ' ↑';
                }

                badge.className = `shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold border ${bgClass} transition-all`;
                badge.textContent = `${item.value}${icon}`;
                historyList.appendChild(badge);
            });
        }

        function triggerShake() {
            const titleBlock = gameTitle.parentElement;
            titleBlock.classList.remove('animate-shake');
            void titleBlock.offsetWidth;
            titleBlock.classList.add('animate-shake');
        }

        function triggerWinState() {
            submitBtn.disabled = true;
            submitBtn.classList.remove('action');
            submitBtn.classList.add('utility');
            submitBtn.querySelector('span').textContent = '¡Resultado Encontrado!';
            guessInput.disabled = true;
            keypadButtons.forEach(button => button.disabled = true);
            clearBtn.disabled = true;
            deleteBtn.disabled = true;
            gameStatusText.textContent = 'Completado';
            gameStatusText.className = 'text-[#B6F023] font-bold';
            document.getElementById('statusDot').classList.add('shadow-[0_0_10px_rgba(182,240,35,0.65)]');
        }

        function resetGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            guessHistory = [];
            gameOver = false;
            
            guessInput.disabled = false;
            guessInput.value = '';
            keypadButtons.forEach(button => button.disabled = false);
            clearBtn.disabled = false;
            deleteBtn.disabled = false;

            submitBtn.disabled = false;
            submitBtn.classList.remove('utility');
            submitBtn.classList.add('action');
            submitBtn.querySelector('span').textContent = 'Comprobar';

            messageContainer.classList.add('hidden');
            messageContainer.classList.remove('message-enter', 'animate-shake');
            gameTitle.parentElement.classList.remove('animate-shake');
            resetTitle();
            historySection.classList.add('hidden');
            historySection.classList.remove('history-enter');
            gameStatusText.textContent = 'En curso';
            gameStatusText.className = 'text-white font-semibold';
            document.getElementById('statusDot').classList.remove('shadow-[0_0_10px_rgba(182,240,35,0.65)]');
        }

    </script>
</body>
</html>
